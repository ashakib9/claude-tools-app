<h1>Claude Tools</h1>
<p>Claude Tools is a private, single-household application. It lets the owner's own Mac read and
organize the owner's own Gmail, Google Drive, Google Calendar and Google Contacts through Google's
APIs.</p>
<p>It is not offered to the public, and no one else can sign in to it.</p>
